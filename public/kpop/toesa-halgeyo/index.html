<script>
(() => {
  const box = document.getElementById("lightbox");
  if (!box) return;
  const shots = [...document.querySelectorAll(".shot")];
  const img = box.querySelector("img");
  let index = 0;

  const show = (next) => {
    if (!shots.length) return;
    index = (next + shots.length) % shots.length;
    const link = shots[index];
    const source = link.querySelector("img");
    img.src = link.href;
    img.alt = source ? source.alt : "";
    if (!box.open) box.showModal();
  };
  const close = () => { if (box.open) box.close(); };

  shots.forEach((link, i) => {
    link.addEventListener("click", (event) => {
      event.preventDefault();
      show(i);
    });
  });
  box.querySelector("[data-nav=prev]").addEventListener("click", () => show(index - 1));
  box.querySelector("[data-nav=next]").addEventListener("click", () => show(index + 1));
  box.querySelector("[data-close]").addEventListener("click", (event) => {
    event.stopPropagation();
    close();
  });
  box.addEventListener("cancel", (event) => {
    event.preventDefault();
    close();
  });
  document.addEventListener("keydown", (event) => {
    if (!box.open) return;
    if (event.key === "ArrowLeft") show(index - 1);
    if (event.key === "ArrowRight") show(index + 1);
  });
})();
</script>
