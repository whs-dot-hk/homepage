# Change this to your real https URL before you care about the sitemap.
# Root-relative "/" keeps links working on Cloudflare Pages before the domain is known.
base_url = "/"
title = "WHS"
description = "A general site. New pieces show up by section, starting with K-pop."
theme = "whs"
compile_sass = false
generate_feeds = true
feed_filenames = ["atom.xml"]
build_search_index = false
minify_html = false
generate_sitemap = true
taxonomies = [{ name = "collections", feed = false, render = false }]

[markdown]
smart_punctuation = true
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = true

[extra]
# Optional. Set to your real origin, no trailing slash, when you know the domain.
# Example: site_url = "https://whs.pages.dev"
site_url = ""
# AdSense site verification. ads.txt at the site root is separate and required too.
adsense_meta = '<meta name="google-adsense-account" content="ca-pub-7747712454888576">'
# Auto ads loader. Google places the ads after the site is approved.
adsense_client = "ca-pub-7747712454888576"

[[extra.categories]]
title = "K-pop"
slug = "kpop"

[[extra.categories]]
title = "K-drama"
slug = "kdrama"
